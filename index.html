<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Calculator</title>
<style>
  :root {
    --bg: #eef1f6; --panel: #ffffff; --text: #1b2330; --muted: #7b8798;
    --key: #f1f4f9; --key-hover: #e4e9f2; --op: #dfe8ff; --op-text: #2748c9;
    --accent: #3b5bfd; --accent-text: #fff; --danger: #ffe3e3; --danger-text: #c62828;
    --shadow: 0 20px 50px rgba(30, 45, 90, .15);
  }
  [data-theme="dark"] {
    --bg: #0f131b; --panel: #181e2a; --text: #e8edf6; --muted: #8592a6;
    --key: #222a39; --key-hover: #2c3648; --op: #26325a; --op-text: #9db3ff;
    --accent: #5b78ff; --accent-text: #fff; --danger: #3a2226; --danger-text: #ff8a8a;
    --shadow: 0 20px 50px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .25s, color .25s;
  }
  .app { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 760px; }
  .calc, .history {
    background: var(--panel); border-radius: 24px; box-shadow: var(--shadow); padding: 18px;
  }
  .calc { width: 360px; max-width: 100%; }
  .history { width: 260px; max-width: 100%; max-height: 640px; display: flex; flex-direction: column; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pill {
    border: 0; background: var(--key); color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .pill:hover { background: var(--key-hover); }
  .pill.on { background: var(--op); color: var(--op-text); }
  .screen { text-align: right; padding: 8px 6px 14px; min-height: 108px; display: flex; flex-direction: column; justify-content: flex-end; }
  .expr { font-size: 22px; color: var(--muted); word-break: break-all; min-height: 30px; }
  .expr .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .result { font-size: 40px; font-weight: 700; word-break: break-all; min-height: 52px; letter-spacing: -.5px; }
  .result.error { color: var(--danger-text); font-size: 22px; }
  .result.preview { color: var(--muted); font-weight: 500; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .keys button {
    border: 0; border-radius: 14px; padding: 14px 0; font-size: 17px; font-weight: 600;
    background: var(--key); color: var(--text); cursor: pointer; transition: transform .06s, background .15s;
  }
  .keys button:hover { background: var(--key-hover); }
  .keys button:active { transform: scale(.94); }
  .keys .op { background: var(--op); color: var(--op-text); }
  .keys .fn { font-size: 14px; color: var(--muted); }
  .keys .clr { background: var(--danger); color: var(--danger-text); }
  .keys .eq { background: var(--accent); color: var(--accent-text); }
  .keys .eq:hover { filter: brightness(1.1); background: var(--accent); }
  .history h3 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .history ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .history li { padding: 10px; border-radius: 12px; cursor: pointer; text-align: right; }
  .history li:hover { background: var(--key); }
  .history li small { display: block; color: var(--muted); font-size: 13px; word-break: break-all; }
  .history li b { font-size: 18px; word-break: break-all; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }
  .mem { font-size: 12px; color: var(--op-text); font-weight: 700; min-width: 24px; }
</style>
</head>
<body>
<div class="app">
  <div class="calc">
    <div class="bar">
      <div>
        <button class="pill on" id="angle" title="Toggle degrees / radians">DEG</button>
        <span class="mem" id="mem"></span>
      </div>
      <button class="pill" id="theme">🌙 Dark</button>
    </div>
    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys" id="keys"></div>
  </div>

  <aside class="history">
    <h3>History <button class="pill" id="clearHist">Clear</button></h3>
    <ul id="histList"></ul>
  </aside>
</div>

<script>
/* ---------- Safe expression parser (no eval) ---------- */
const state = { expr: "", degrees: true, memory: 0, justEvaluated: false, history: [] };

function tokenize(src) {
  const tokens = [];
  const re = /\s*(\d+\.?\d*|\.\d+|[a-zA-Zπ√]+|[+\-×÷*\/^%!()])/y;
  let m, pos = 0;
  while (pos < src.length) {
    re.lastIndex = pos;
    m = re.exec(src);
    if (!m) { if (/^\s*$/.test(src.slice(pos))) break; throw new Error("Unexpected character"); }
    tokens.push(m[1]);
    pos = re.lastIndex;
  }
  return tokens;
}

function evaluate(src) {
  const t = tokenize(src);
  let i = 0;
  const peek = () => t[i];
  const next = () => t[i++];
  const isNum = x => x !== undefined && /^[\d.]/.test(x);
  const isName = x => x !== undefined && /^[a-zA-Zπ√]/.test(x);
  const toRad = x => state.degrees ? x * Math.PI / 180 : x;
  const fromRad = x => state.degrees ? x * 180 / Math.PI : x;

  const funcs = {
    sin: x => { const r = Math.sin(toRad(x)); return Math.abs(r) < 1e-15 ? 0 : r; },
    cos: x => { const r = Math.cos(toRad(x)); return Math.abs(r) < 1e-15 ? 0 : r; },
    tan: x => Math.tan(toRad(x)),
    asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
    sqrt: Math.sqrt, "√": Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
    ln: Math.log, log: Math.log10, exp: Math.exp, floor: Math.floor, ceil: Math.ceil, round: Math.round
  };
  const consts = { pi: Math.PI, "π": Math.PI, e: Math.E };

  function factorial(n) {
    if (n < 0 || !Number.isInteger(n)) throw new Error("Factorial needs a whole number");
    if (n > 170) return Infinity;
    let r = 1; for (let k = 2; k <= n; k++) r *= k; return r;
  }

  // Each parse function returns { v: value, pct: bool } so "200 + 10%" means 200 + 10% of 200
  function parseExpr() {
    let left = parseTerm();
    while (peek() === "+" || peek() === "-") {
      const op = next();
      const right = parseTerm();
      const rv = right.pct ? left.v * right.v : right.v;
      left = { v: op === "+" ? left.v + rv : left.v - rv, pct: false };
    }
    return left;
  }
  function parseTerm() {
    let left = parseUnary();
    for (;;) {
      const p = peek();
      if (p === "×" || p === "*" || p === "÷" || p === "/") {
        next();
        const right = parseUnary();
        if ((p === "÷" || p === "/") && right.v === 0) throw new Error("Cannot divide by zero");
        left = { v: (p === "×" || p === "*") ? left.v * right.v : left.v / right.v, pct: false };
      } else if (p === "(" || isName(p)) {
        // implicit multiplication: 2(3), 2π, 3sin(30)
        const right = parseUnary();
        left = { v: left.v * right.v, pct: false };
      } else break;
    }
    return left;
  }
  function parseUnary() {
    if (peek() === "-") { next(); const r = parseUnary(); return { v: -r.v, pct: false }; }
    if (peek() === "+") { next(); return parseUnary(); }
    return parsePower();
  }
  function parsePower() {
    const base = parsePostfix();
    if (peek() === "^") { next(); const exp = parseUnary(); return { v: Math.pow(base.v, exp.v), pct: false }; }
    return base;
  }
  function parsePostfix() {
    let node = parsePrimary();
    while (peek() === "!" || peek() === "%") {
      const op = next();
      node = op === "!" ? { v: factorial(node.v), pct: false } : { v: node.v / 100, pct: true };
    }
    return node;
  }
  function parsePrimary() {
    const tok = next();
    if (tok === undefined) throw new Error("Incomplete expression");
    if (isNum(tok)) return { v: parseFloat(tok), pct: false };
    if (tok === "(") {
      const r = parseExpr();
      if (peek() === ")") next();            // forgive a missing ")"
      return { v: r.v, pct: false };
    }
    if (isName(tok)) {
      const name = tok.toLowerCase();
      if (name in funcs) {
        let arg;
        if (peek() === "(") { next(); arg = parseExpr(); if (peek() === ")") next(); }
        else arg = parseUnary();
        return { v: funcs[name](arg.v), pct: false };
      }
      if (name in consts) return { v: consts[name], pct: false };
      throw new Error("Unknown: " + tok);
    }
    throw new Error("Unexpected " + tok);
  }

  const out = parseExpr();
  if (i < t.length) throw new Error("Unexpected " + t[i]);
  if (!Number.isFinite(out.v)) throw new Error(Number.isNaN(out.v) ? "Not a number" : "Result too large");
  return out.v;
}

function format(n) {
  if (Object.is(n, -0)) n = 0;
  const r = parseFloat(n.toPrecision(12));
  if (Math.abs(r) >= 1e15 || (Math.abs(r) < 1e-9 && r !== 0)) return r.toExponential(6).replace(/\.?0+e/, "e");
  return r.toLocaleString("en-US", { maximumFractionDigits: 10 });
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const exprEl = $("expr"), resEl = $("result");

const layout = [
  ["sin(", "sin", "fn"], ["cos(", "cos", "fn"], ["tan(", "tan", "fn"], ["ln(", "ln", "fn"], ["log(", "log", "fn"],
  ["√(", "√", "fn"], ["^", "xʸ", "fn"], ["π", "π", "fn"], ["!", "n!", "fn"], ["mem", "MR", "fn"],
  ["(", "(", "op"], [")", ")", "op"], ["%", "%", "op"], ["back", "⌫", "op"], ["clear", "AC", "clr"],
  ["7", "7"], ["8", "8"], ["9", "9"], ["÷", "÷", "op"], ["m+", "M+", "fn"],
  ["4", "4"], ["5", "5"], ["6", "6"], ["×", "×", "op"], ["m-", "M−", "fn"],
  ["1", "1"], ["2", "2"], ["3", "3"], ["-", "−", "op"], ["mc", "MC", "fn"],
  ["0", "0"], [".", "."], ["ans", "Ans", "op"], ["+", "+", "op"], ["=", "=", "eq"],
];
const keysEl = $("keys");
layout.forEach(([val, label, cls]) => {
  const b = document.createElement("button");
  b.textContent = label; b.dataset.val = val; if (cls) b.className = cls;
  keysEl.appendChild(b);
});

function render() {
  exprEl.innerHTML = (state.expr || "&nbsp;").replace(/</g, "&lt;") + '<span class="cursor"></span>';
  $("mem").textContent = state.memory !== 0 ? "M = " + format(state.memory) : "";
  if (state.justEvaluated) return;
  // live preview
  resEl.className = "result preview";
  if (!state.expr.trim()) { resEl.textContent = "0"; resEl.className = "result"; return; }
  try { resEl.textContent = "= " + format(evaluate(state.expr)); }
  catch { resEl.textContent = ""; }
}

function insert(s) {
  if (state.justEvaluated) {
    // continue from answer when an operator is typed, otherwise start fresh
    state.expr = /^[+\-×÷^%!]/.test(s) ? lastAnswer + "" : "";
    state.justEvaluated = false;
  }
  state.expr += s;
  render();
}

let lastAnswer = "0";
function calculate() {
  if (!state.expr.trim()) return;
  try {
    const val = evaluate(state.expr);
    const text = format(val);
    lastAnswer = String(parseFloat(val.toPrecision(12)));
    state.history.unshift({ expr: state.expr, result: text, raw: lastAnswer });
    state.history = state.history.slice(0, 50);
    resEl.className = "result"; resEl.textContent = text;
    state.justEvaluated = true;
    renderHistory();
  } catch (err) {
    resEl.className = "result error"; resEl.textContent = err.message;
  }
  render2();
}
function render2() { exprEl.innerHTML = state.expr.replace(/</g, "&lt;") + " ="; }

function press(v) {
  switch (v) {
    case "=": return calculate();
    case "clear": state.expr = ""; state.justEvaluated = false; return render();
    case "back":
      if (state.justEvaluated) { state.justEvaluated = false; }
      state.expr = state.expr.replace(/(sin\(|cos\(|tan\(|ln\(|log\(|√\(|.)$/, ""); return render();
    case "ans": return insert(lastAnswer);
    case "mem": return insert(String(state.memory));
    case "mc": state.memory = 0; return render();
    case "m+": case "m-": {
      try {
        const cur = state.expr.trim() ? evaluate(state.expr) : parseFloat(lastAnswer);
        state.memory += v === "m+" ? cur : -cur;
      } catch {}
      return render();
    }
    default: insert(v);
  }
}

keysEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) press(b.dataset.val); });

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (/^[0-9.()+\-^%!]$/.test(k)) { insert(k); e.preventDefault(); }
  else if (k === "*" || k === "x") { insert("×"); e.preventDefault(); }
  else if (k === "/") { insert("÷"); e.preventDefault(); }
  else if (k === "Enter" || k === "=") { calculate(); e.preventDefault(); }
  else if (k === "Backspace") press("back");
  else if (k === "Escape" || k === "Delete") press("clear");
  else if (/^[a-z]$/i.test(k)) { insert(k.toLowerCase()); }   // type sin(, sqrt(, pi ... by hand
});

/* ---------- History, theme, angle mode ---------- */
function renderHistory() {
  const ul = $("histList");
  if (!state.history.length) { ul.innerHTML = '<div class="empty">No calculations yet</div>'; return; }
  ul.innerHTML = "";
  state.history.forEach(h => {
    const li = document.createElement("li");
    const s = document.createElement("small"); s.textContent = h.expr;
    const b = document.createElement("b"); b.textContent = h.result;
    li.append(s, b);
    li.onclick = () => { state.expr = h.raw; state.justEvaluated = false; render(); };
    ul.appendChild(li);
  });
}
$("clearHist").onclick = () => { state.history = []; renderHistory(); };

$("angle").onclick = e => {
  state.degrees = !state.degrees;
  e.target.textContent = state.degrees ? "DEG" : "RAD";
  e.target.classList.toggle("on", state.degrees);
  state.justEvaluated = false; render();
};
$("theme").onclick = e => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  e.target.textContent = dark ? "☀️ Light" : "🌙 Dark";
};
if (matchMedia("(prefers-color-scheme: dark)").matches) $("theme").click();

renderHistory(); render();
</script>
</body>
</html>
